# Render 배포 설정 (Blueprint)
# 저장소를 연결하면 이 파일을 읽어 자동으로 설정된다.
services:
  - type: web
    name: stock-ledger
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 아래 값들은 Render 대시보드에서 직접 입력한다 (sync: false = 저장소에 값을 두지 않음)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SIGNUP_CODE
        sync: false
      # 비밀번호 찾기 메일 (Gmail 주소 + 앱 비밀번호)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
